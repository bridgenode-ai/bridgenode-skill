name: Publish Skill to ClawHub

on:
  push:
    branches: [main]
    paths: ['SKILL.md']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g clawhub
      - run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}"
      - run: clawhub skill publish . --slug bridgenode --owner bridgenode --name "BridgeNode — x402 pay-per-request LLM inference for AI agents (Solana USDC)" --categories finance,integrations --topics x402,solana,usdc,mcp,llm
