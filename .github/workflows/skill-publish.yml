name: Publish Skill to ClawHub

on:
  push:
    branches: [main]
    paths: ['SKILL.md', '.github/workflows/skill-publish.yml']
  workflow_dispatch:

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      skill_path: "."
      dry_run: false
      owner: bridgenode
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
